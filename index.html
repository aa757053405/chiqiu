<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>彩球吃吃大作战 - 增强版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #111;
    color-scheme: dark;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: none;
    color: white;
}
#starfield {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
}
canvas {
    display: block;
    background: transparent;
}
#gameInfo {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 18px;
    text-shadow: 1px 1px 2px black;
}
#gameOver, #startScreen, #leaderboardScreen {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    width: 90vw;
    max-width: 400px;
    background: rgba(0, 0, 0, 0.8);
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
}
#startScreen h1 {
    font-size: 36px;
    margin-bottom: 20px;
    background: linear-gradient(45deg, #FF0000, #00FF00, #0000FF, #FFFF00, #FF00FF, #00FFFF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rainbow 3s linear infinite;
    white-space: nowrap;
}
@keyframes rainbow {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
}
#startScreen .demo-area {
    width: 200px;
    height: 200px;
    margin: 20px auto;
    position: relative;
    border: 2px solid #444;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
}
#startScreen .demo-ball {
    position: absolute;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #00FF00;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
}
#startScreen .demo-enemy {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    animation: demoAttack 3s linear infinite;
}
@keyframes demoAttack {
    0% { transform: translate(0, 0); }
    100% { transform: translate(var(--tx), var(--ty)); }
}
.rule-item {
    margin: 10px 0;
    font-size: 16px;
    line-height: 1.6;
}
.rule-item::before {
    content: "🎮 ";
}
#startBtn, #restartBtn, #saveScoreBtn, #viewLeaderboardBtn, #backToMenuBtn {
    padding: 15px 40px;
    font-size: 20px;
    background: linear-gradient(45deg, #4CAF50, #45a049);
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    margin-top: 20px;
    transition: transform 0.2s;
    display: block;
    width: 100%;
}
#startBtn:hover, #restartBtn:hover, #saveScoreBtn:hover, #viewLeaderboardBtn:hover, #backToMenuBtn:hover {
    transform: scale(1.05);
}
#gameOver, #leaderboardScreen {
    display: none;
}
.life-change {
    position: absolute;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    z-index: 10;
    pointer-events: none;
    animation: floatUp 1.5s ease-out forwards;
}
@keyframes floatUp {
    0% {
        transform: translateY(0);
        opacity: 1;
    }
    100% {
        transform: translateY(-50px);
        opacity: 0;
    }
}
#playerName {
    padding: 12px;
    font-size: 18px;
    width: 100%;
    margin: 15px 0;
    border: 2px solid #4CAF50;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    text-align: center;
}
.leaderboard-list {
    list-style: none;
    margin: 20px 0;
    text-align: left;
}
.leaderboard-item {
    padding: 10px;
    margin: 8px 0;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
}
.leaderboard-item:nth-child(1) {
    background: linear-gradient(45deg, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.1));
    border: 1px solid gold;
}
.leaderboard-item:nth-child(2) {
    background: linear-gradient(45deg, rgba(192, 192, 192, 0.3), rgba(192, 192, 192, 0.1));
    border: 1px solid silver;
}
.leaderboard-item:nth-child(3) {
    background: linear-gradient(45deg, rgba(205, 127, 50, 0.3), rgba(205, 127, 50, 0.1));
    border: 1px solid #cd7f32;
}
.buttons-container {
    display: flex;
    gap: 10px;
}
.buttons-container button {
    flex: 1;
}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<canvas id="gameCanvas" style="display:none;"></canvas>
<div id="gameInfo" style="display: none;">
<div>分数: <span id="score">0</span></div>
<div>生命: <span id="lives">3</span></div>
<div>下次变色: <span id="colorChangeTimer">0</span>秒</div>
</div>

<div id="startScreen">
<h1>彩球吃吃大作战</h1>
<div class="demo-area">
<div class="demo-ball">👀</div>
<div class="demo-enemy" style="background: #FF0000; top: 10px; left: 50%; --tx: 0px; --ty: 70px;"></div>
<div class="demo-enemy" style="background: #00FF00; top: 50%; right: 10px; --tx: -70px; --ty: 0px;"></div>
<div class="demo-enemy" style="background: #0000FF; bottom: 10px; left: 50%; --tx: 0px; --ty: -70px;"></div>
<div class="demo-enemy" style="background: #FFFF00; top: 50%; left: 10px; --tx: 70px; --ty: 0px;"></div>
</div>
<div class="rules">
<div class="rule-item">吃掉相同颜色的球 +1分</div>
<div class="rule-item">碰到不同颜色的球 -1生命</div>
<div class="rule-item">彩虹球🌈 +1生命（稀有）</div>
<div class="rule-item">颜色变换前会有闪烁提示</div>
</div>
<button id="startBtn">开始游戏</button>
<button id="viewLeaderboardBtn">查看排行榜</button>
</div>

<div id="gameOver">
<h2>游戏结束</h2>
<p>最终得分: <span id="finalScore">0</span></p>
<input type="text" id="playerName" placeholder="输入你的昵称" maxlength="12">
<div class="buttons-container">
<button id="saveScoreBtn">保存分数</button>
<button id="restartBtn">重新开始</button>
</div>
<button id="backToMenuBtn">返回主菜单</button>
</div>

<div id="leaderboardScreen">
<h2>排行榜</h2>
<ul class="leaderboard-list" id="leaderboardList">
<!-- 排行榜内容将通过JavaScript动态生成 -->
</ul>
<button id="backToMenuBtn2">返回主菜单</button>
</div>

<script>
const starCanvas = document.getElementById('starfield');
const starCtx = starCanvas.getContext('2d');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('startScreen');
const gameInfo = document.getElementById('gameInfo');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const colorChangeTimerEl = document.getElementById('colorChangeTimer');
const gameOverEl = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const saveScoreBtn = document.getElementById('saveScoreBtn');
const viewLeaderboardBtn = document.getElementById('viewLeaderboardBtn');
const backToMenuBtn = document.getElementById('backToMenuBtn');
const backToMenuBtn2 = document.getElementById('backToMenuBtn2');
const playerNameInput = document.getElementById('playerName');
const leaderboardScreen = document.getElementById('leaderboardScreen');
const leaderboardList = document.getElementById('leaderboardList');

// 排行榜数据存储
function getLeaderboard() {
    const leaderboard = localStorage.getItem('colorBallLeaderboard');
    return leaderboard ? JSON.parse(leaderboard) : [];
}

function saveLeaderboard(leaderboard) {
    localStorage.setItem('colorBallLeaderboard', JSON.stringify(leaderboard));
}

function addToLeaderboard(name, score) {
    const leaderboard = getLeaderboard();
    leaderboard.push({ name, score, date: new Date().toLocaleDateString() });
    
    // 按分数排序
    leaderboard.sort((a, b) => b.score - a.score);
    
    // 只保留前5名
    if (leaderboard.length > 5) {
        leaderboard.splice(5);
    }
    
    saveLeaderboard(leaderboard);
    displayLeaderboard();
}

function displayLeaderboard() {
    const leaderboard = getLeaderboard();
    leaderboardList.innerHTML = '';
    
    if (leaderboard.length === 0) {
        leaderboardList.innerHTML = '<li class="leaderboard-item">暂无记录</li>';
        return;
    }
    
    leaderboard.forEach((entry, index) => {
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `
            <span>${index + 1}. ${entry.name}</span>
            <span>${entry.score}分</span>
        `;
        leaderboardList.appendChild(li);
    });
}

function resize() {
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// 闪烁星空背景
const stars = [];
for (let i = 0; i < 150; i++) {
    stars.push({
        x: Math.random() * starCanvas.width,
        y: Math.random() * starCanvas.height,
        r: Math.random() * 1.5 + 0.5,
        a: Math.random(),
        d: Math.random() < 0.5 ? -0.01 : 0.01
    });
}
function drawStarfield() {
    starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
    stars.forEach(star => {
        starCtx.globalAlpha = star.a;
        starCtx.fillStyle = 'white';
        starCtx.beginPath();
        starCtx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        starCtx.fill();
        star.a += star.d;
        if (star.a <= 0.1 || star.a >= 1) star.d *= -1;
    });
    requestAnimationFrame(drawStarfield);
}
drawStarfield();

const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF'];
let score = 0;
let lives = 3;
let difficulty = 1;
let enemies = [];
let colorChangeTimer = 0;
let colorChangeInterval = 15000;
let gameRunning = false;

// 颜色变换提示相关变量
let isColorChanging = false;
let colorChangeCount = 0;
let nextColor = '';
let originalColor = '';

// 生命值变化提示数组
let lifeChanges = [];

const player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 30,
    color: colors[0],
    isDragging: false,
    dragOffsetX: 0,
    dragOffsetY: 0
};

// 粒子系统
const particles = [];
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.radius = Math.random() * 3 + 1;
        this.color = color;
        this.alpha = 1;
        this.decay = 0.02;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// 生命值变化提示类
class LifeChange {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.lifetime = 0;
        this.maxLifetime = 90; // 大约1.5秒
    }
    
    update() {
        this.lifetime++;
        this.y -= 0.5; // 向上飘动
    }
    
    draw() {
        const progress = this.lifetime / this.maxLifetime;
        const alpha = 1 - progress;
        
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
    
    isExpired() {
        return this.lifetime >= this.maxLifetime;
    }
}

function createEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    switch (side) {
        case 0: x = Math.random() * canvas.width; y = -30; break;
        case 1: x = canvas.width + 30; y = Math.random() * canvas.height; break;
        case 2: x = Math.random() * canvas.width; y = canvas.height + 30; break;
        case 3: x = -30; y = Math.random() * canvas.height; break;
    }
    const dx = player.x - x;
    const dy = player.y - y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const speed = 1.5 + difficulty * 0.4;
    const vx = (dx / dist) * speed;
    const vy = (dy / dist) * speed;
    const isRainbow = Math.random() < 0.01;
    enemies.push({
        x, y, vx, vy, radius: 15,
        color: isRainbow ? 'rainbow' : colors[Math.floor(Math.random() * colors.length)],
        isRainbow
    });
}

function drawBall(ball) {
    ctx.save();
    if (ball.isRainbow) {
        const g = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.radius);
        g.addColorStop(0, '#FF0000');
        g.addColorStop(0.2, '#FF7F00');
        g.addColorStop(0.4, '#FFFF00');
        g.addColorStop(0.6, '#00FF00');
        g.addColorStop(0.8, '#0000FF');
        g.addColorStop(1, '#8B00FF');
        ctx.fillStyle = g;
    } else {
        ctx.fillStyle = ball.color;
    }
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();

    if (ball === player) {
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(ball.x - 8, ball.y - 5, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ball.x + 8, ball.y - 5, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'black';
        ctx.beginPath(); ctx.arc(ball.x - 8, ball.y - 5, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ball.x + 8, ball.y - 5, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

function checkCollision(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy) < a.radius + b.radius;
}

function setRandomColorChange() {
    colorChangeInterval = Math.random() * (15000 - 5000) + 5000;
    colorChangeTimer = 0;
}

// 开始颜色变换提示
function startColorChange() {
    isColorChanging = true;
    colorChangeCount = 0;
    originalColor = player.color;
    
    // 随机选择下一个颜色，确保与当前颜色不同
    do {
        nextColor = colors[Math.floor(Math.random() * colors.length)];
    } while (nextColor === originalColor);
}

// 处理颜色变换逻辑
function handleColorChange() {
    if (!isColorChanging) {
        colorChangeTimer += 16;
        
        // 检查是否需要开始颜色变换提示
        if (colorChangeTimer >= colorChangeInterval - 1000) {
            startColorChange();
        }
    } else {
        // 颜色变换过程中
        const elapsedTime = colorChangeTimer - (colorChangeInterval - 1000);
        const flashInterval = 1000 / 6; // 1秒内完成3次闪烁（6次变化）
        
        // 根据时间计算当前应该显示的颜色
        const flashIndex = Math.floor(elapsedTime / flashInterval);
        
        if (flashIndex < 6) { // 总共6次变化（3次闪烁）
            // 偶数索引显示原色，奇数索引显示新颜色
            player.color = flashIndex % 2 === 0 ? originalColor : nextColor;
        } else {
            // 颜色变换完成
            player.color = nextColor;
            isColorChanging = false;
            colorChangeTimer = 0;
            setRandomColorChange();
        }
    }
    
    // 更新UI显示
    const remainingTime = isColorChanging ? 
        0 : Math.max(0, (colorChangeInterval - colorChangeTimer) / 1000);
    colorChangeTimerEl.textContent = remainingTime.toFixed(1);
}

function gameLoop() {
    if (!gameRunning) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 处理颜色变换
    handleColorChange();

    if (enemies.length < 12 && Math.random() < 0.03 + difficulty * 0.01) createEnemy();

    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx;
        e.y += e.vy;

        if (checkCollision(player, e)) {
            if (e.isRainbow) {
                lives++;
                // 添加生命值增加提示
                lifeChanges.push(new LifeChange(player.x, player.y, "+1 生命", "#00FF00"));
                enemies.splice(i, 1);
                continue;
            }
            if (e.color === player.color) {
                score++;
                difficulty = Math.floor(score / 10) + 1;
                enemies.splice(i, 1);
                continue;
            } else {
                lives--;
                // 添加生命值减少提示
                lifeChanges.push(new LifeChange(player.x, player.y, "-1 生命", "#FF0000"));
                // 生成撞击粒子
                for (let j = 0; j < 15; j++) {
                    particles.push(new Particle(e.x, e.y, e.isRainbow ? '#FFFFFF' : e.color));
                }
                enemies.splice(i, 1);
                if (lives <= 0) {
                    gameOver(); return;
                }
                continue;
            }
        }

        if (e.x < -50 || e.x > canvas.width + 50 || e.y < -50 || e.y > canvas.height + 50) {
            enemies.splice(i, 1);
            continue;
        }

        drawBall(e);
    }

    // 更新和绘制粒子
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
    }
    
    // 更新和绘制生命值变化提示
    for (let i = lifeChanges.length - 1; i >= 0; i--) {
        const lc = lifeChanges[i];
        lc.update();
        lc.draw();
        if (lc.isExpired()) {
            lifeChanges.splice(i, 1);
        }
    }

    drawBall(player);
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    requestAnimationFrame(gameLoop);
}

function gameOver() {
    gameRunning = false;
    finalScoreEl.textContent = score;
    gameOverEl.style.display = 'block';
    gameInfo.style.display = 'none';
    playerNameInput.value = '';
}

function startGame() {
    startScreen.style.display = 'none';
    leaderboardScreen.style.display = 'none';
    gameInfo.style.display = 'block';
    canvas.style.display = 'block';
    score = 0; lives = 3; difficulty = 1; enemies = []; particles.length = 0; lifeChanges.length = 0;
    isColorChanging = false;
    colorChangeTimer = 0;
    resize();
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.color = colors[0];
    setRandomColorChange();
    gameRunning = true;
    gameLoop();
}

function showLeaderboard() {
    startScreen.style.display = 'none';
    gameOverEl.style.display = 'none';
    leaderboardScreen.style.display = 'block';
    displayLeaderboard();
}

function backToMenu() {
    gameOverEl.style.display = 'none';
    leaderboardScreen.style.display = 'none';
    startScreen.style.display = 'block';
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', () => {
    gameOverEl.style.display = 'none';
    startGame();
});
saveScoreBtn.addEventListener('click', () => {
    const name = playerNameInput.value.trim() || '匿名玩家';
    if (name) {
        addToLeaderboard(name, score);
        showLeaderboard();
    }
});
viewLeaderboardBtn.addEventListener('click', showLeaderboard);
backToMenuBtn.addEventListener('click', backToMenu);
backToMenuBtn2.addEventListener('click', backToMenu);

function getPos(e) {
    if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
}

function startDrag(e) {
    e.preventDefault();
    const p = getPos(e);
    const dx = p.x - player.x;
    const dy = p.y - player.y;
    if (Math.sqrt(dx * dx + dy * dy) < player.radius) {
        player.isDragging = true;
        player.dragOffsetX = dx;
        player.dragOffsetY = dy;
    }
}

function drag(e) {
    e.preventDefault();
    if (!player.isDragging) return;
    const p = getPos(e);
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, p.x - player.dragOffsetX));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, p.y - player.dragOffsetY));
}

function endDrag(e) {
    e.preventDefault();
    player.isDragging = false;
}

canvas.addEventListener('touchstart', startDrag);
canvas.addEventListener('touchmove', drag);
canvas.addEventListener('touchend', endDrag);
canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('mousemove', drag);
canvas.addEventListener('mouseup', endDrag);

// 初始化排行榜显示
displayLeaderboard();
</script>
</body>
</html>
